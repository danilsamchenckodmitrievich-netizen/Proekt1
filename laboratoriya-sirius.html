<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лаборатория Сириус</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFBF7; --ink:#1F2340; --muted:#6B6F85; --surf:#FFFFFF; --grid:#E6E4EC; --line:#E4E2EA;
  --plum:#9B2D67; --teal:#50ADA8; --green:#367A55; --lime:#99CC42; --pink:#F8D3E8; --soft:#F3F1F7;
  --brand:#5B3C9E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121A; --ink:#F1EEF6; --muted:#A39FB3; --surf:#211B29; --grid:#372F42; --line:#372F42;
    --pink:#4A2340; --soft:#272031; --brand:#B79CF2; --plum:#D0568F;
  }
}
:root[data-theme="dark"]{
  --bg:#16121A; --ink:#F1EEF6; --muted:#A39FB3; --surf:#211B29; --grid:#372F42; --line:#372F42;
  --pink:#4A2340; --soft:#272031; --brand:#B79CF2; --plum:#D0568F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:16px 20px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo svg{width:38px;height:auto;flex:none}
.logo b{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:-.2px}
.logo span{font-size:22px;font-weight:500;color:var(--muted);margin-left:-4px}

/* home */
.hero{padding:18px 20px 6px}
.hero h1{margin:0;font-size:clamp(34px,9vw,52px);line-height:1.05;font-weight:800;letter-spacing:-1px}
.hero p{margin:12px 0 0;color:var(--muted);font-size:18px;max-width:34ch}
.progress{margin:20px 20px 4px;display:flex;align-items:center;gap:14px;font-weight:600;color:var(--muted);font-size:15px}
.bar{flex:1;height:10px;border-radius:6px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:6px;transition:width .4s}
.chips{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:9px 16px;background:var(--soft);font-weight:600;font-size:15px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cards{display:grid;gap:16px;padding:6px 20px 40px}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;border-radius:30px;padding:24px;min-height:300px;display:flex;flex-direction:column;
  background:var(--c);color:#fff;text-align:left;border:0;width:100%}
.card .pb{height:8px;width:56%;border-radius:5px;background:rgba(255,255,255,.28);margin:0 0 22px 8px;overflow:hidden}
.card .pb i{display:block;height:100%;width:0;background:var(--lime);border-radius:5px}
.card.seen .pb i{width:100%}
.tag{align-self:flex-start;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.card h2{margin:14px 0 8px;font-size:28px;line-height:1.12;font-weight:800;letter-spacing:-.4px}
.card p{margin:0;opacity:.88;font-size:16px}
.card .foot{margin-top:auto;padding-top:22px;display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.card .meta{font-size:15px;opacity:.8;display:flex;align-items:center;gap:8px}
.go{background:var(--lime);color:#1B2A0A;font-weight:700;font-size:18px;border-radius:16px;padding:14px 28px;border:0;flex:1;text-align:center;max-width:220px}

/* lab */
.labhead{background:var(--lab);color:#fff;padding:14px 20px 78px}
.back{background:rgba(255,255,255,.18);border:0;border-radius:999px;color:#fff;font-weight:600;padding:8px 16px 8px 12px;display:inline-flex;gap:6px;align-items:center;font-size:15px}
.labhead h1{margin:18px 0 6px;font-size:clamp(30px,8vw,44px);line-height:1.08;font-weight:800;letter-spacing:-.7px}
.labhead p{margin:0;opacity:.9;max-width:40ch}
.labhead .tag{margin-top:16px;display:inline-block}
.sheet{margin-top:-58px;position:relative;padding:0 14px 60px}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surf);border-radius:26px;
  padding:8px;box-shadow:0 2px 0 var(--line), 0 12px 30px -18px rgba(31,35,64,.5)}
.stage canvas{display:block;width:100%;aspect-ratio:640/400;border-radius:20px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 6px 4px}
.btn{border-radius:16px;padding:12px 20px;font-weight:700;border:2px solid var(--line);background:var(--surf)}
.btn.main{background:var(--lime);border-color:var(--lime);color:#1B2A0A}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 6px}
.out{background:var(--soft);border-radius:18px;padding:12px 14px}
.out small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.out b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sheet h2{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:26px 6px 12px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:0 6px 10px}
.presets .chip{border:2px solid var(--line);background:var(--surf)}
.ctl{background:var(--surf);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin:10px 6px}
.ctl .r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:15px}
.val{background:var(--pink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;margin:12px 0 2px;height:28px;accent-color:var(--lab)}
.seg{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--lab);border-color:var(--lab);color:#fff}
.note{border-radius:26px;padding:20px 22px;margin:14px 6px;background:var(--pink)}
.note b{font-weight:800}
.note.f{background:var(--soft)}
.note .fm{font-size:20px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums}
.note ul,.note ol{margin:8px 0 0;padding-left:20px}
.note li{margin:6px 0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
const W=640,H=400;
const $=(s,r=document)=>r.querySelector(s);
const f1=(x,d=1)=>Number(x).toFixed(d).replace('.',',');
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const rgb=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgba=(h,a)=>{const c=rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`};
const mixc=(a,b,t)=>{const x=rgb(a),y=rgb(b);return `rgb(${Math.round(x[0]+(y[0]-x[0])*t)},${Math.round(x[1]+(y[1]-x[1])*t)},${Math.round(x[2]+(y[2]-x[2])*t)})`};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const FONT="'Golos Text',system-ui,sans-serif";

let C={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  ['ink','muted','surf','grid','plum','teal','green','lime','soft','pink'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim());
}
function arrow(g,x1,y1,x2,y2,col,w){
  w=w||3;const a=Math.atan2(y2-y1,x2-x1),h=9+w;
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.lineCap='round';
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*.6,y2-Math.sin(a)*h*.6);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-h*Math.cos(a-.42),y2-h*Math.sin(a-.42));g.lineTo(x2-h*Math.cos(a+.42),y2-h*Math.sin(a+.42));g.closePath();g.fill();
}
function txt(g,s,x,y,o){
  o=o||{};g.font=`${o.w||600} ${o.s||14}px ${FONT}`;g.fillStyle=o.c||C.ink;g.textAlign=o.a||'left';g.textBaseline=o.b||'alphabetic';g.fillText(s,x,y);
}
function graph(g,x,y,w,h,hist,vmax,col,label){
  g.save();
  g.fillStyle=C.soft;g.beginPath();g.roundRect(x,y,w,h,12);g.fill();
  g.strokeStyle=C.grid;g.lineWidth=1.5;g.beginPath();g.moveTo(x+8,y+h/2);g.lineTo(x+w-8,y+h/2);g.stroke();
  if(hist.length>1){
    const t1=hist[hist.length-1].t,t0=t1-6;
    g.beginPath();g.rect(x,y,w,h);g.clip();
    g.strokeStyle=col;g.lineWidth=3;g.lineJoin='round';g.beginPath();
    let first=true;
    for(const p of hist){const px=x+8+(p.t-t0)/6*(w-16),py=y+h/2-Math.max(-1.2,Math.min(1.2,p.v/vmax))*(h/2-10);
      if(first){g.moveTo(px,py);first=false}else g.lineTo(px,py)}
    g.stroke();
  }
  g.restore();
  txt(g,label,x+10,y+16,{s:12,c:C.muted,w:500});
}
function pushHist(S,t,v){S.hist.push({t,v});while(S.hist.length&&S.hist[0].t<t-6.2)S.hist.shift();}

/* ===================== LABS ===================== */
const LABS=[];

/* 1. Бросок под углом */
LABS.push({
  id:'projectile',title:'Бросок под углом',cat:'Механика',color:'#9B2D67',
  short:'Как летит тело, брошенное под углом к горизонту. Меняйте скорость, угол и даже планету.',
  params:[
    {id:'v',label:'Начальная скорость',min:5,max:40,step:1,val:20,unit:'м/с'},
    {id:'a',label:'Угол броска',min:5,max:85,step:1,val:45,unit:'°'},
    {id:'h',label:'Высота старта',min:0,max:30,step:1,val:0,unit:'м'},
    {id:'g',label:'Ускорение свободного падения',min:1,max:25,step:0.1,val:9.8,unit:'м/с²',d:1}
  ],
  presets:[['Земля',{g:9.8}],['Луна',{g:1.6}],['Марс',{g:3.7}],['Юпитер',{g:24.8}]],
  restartOn:'all',launch:true,
  def:'Тело, брошенное под углом к горизонту, одновременно движется равномерно вдоль земли и равноускоренно по вертикали. Траектория получается параболой.',
  formulas:['x = v₀·cos α · t','y = h + v₀·sin α · t − g·t²/2'],
  tryit:['Поставьте угол 45° — на ровной земле дальность будет максимальной.','Сравните углы 30° и 60°: дальность почти одинаковая.','Переключитесь на Луну: как изменилась дальность и время полёта?'],
  init(S,P){S.t=0;S.trail=[];S.x=0;S.y=P.h;S.done=false;S.acc=0;S.vx=P.v*Math.cos(rad(P.a));S.vy=P.v*Math.sin(rad(P.a));},
  calc(P){const vy=P.v*Math.sin(rad(P.a)),vx=P.v*Math.cos(rad(P.a));const T=(vy+Math.sqrt(vy*vy+2*P.g*P.h))/P.g;return{T,R:vx*T,Hm:P.h+vy*vy/(2*P.g)}},
  step(S,P,dt){
    if(S.done)return;const c=this.calc(P);S.t=Math.min(S.t+dt,c.T);
    const vx=P.v*Math.cos(rad(P.a)),vy0=P.v*Math.sin(rad(P.a));
    S.x=vx*S.t;S.y=Math.max(0,P.h+vy0*S.t-P.g*S.t*S.t/2);S.vx=vx;S.vy=vy0-P.g*S.t;
    S.acc+=dt;if(S.acc>0.03){S.acc=0;S.trail.push([S.x,S.y])}
    if(S.t>=c.T){S.done=true;S.trail.push([S.x,0])}
  },
  draw(g,S,P){
    const c=this.calc(P),ox=44,gy=H-38;
    const k=Math.min((W-90)/Math.max(c.R,1),(gy-46)/Math.max(c.Hm,1));
    const X=x=>ox+x*k,Y=y=>gy-y*k;
    // сетка
    const steps=[1,2,5,10,20,50,100,200];let st=steps.find(s=>c.R/s<=8)||200;
    g.strokeStyle=C.grid;g.lineWidth=1;g.fillStyle=C.muted;
    for(let x=0;x<=c.R*1.05+st;x+=st){g.beginPath();g.moveTo(X(x),gy);g.lineTo(X(x),46);g.stroke();txt(g,x+' м',X(x),gy+20,{s:11,a:'center',c:C.muted,w:500})}
    // земля
    g.fillStyle=C.green;g.fillRect(0,gy,W,H-gy);
    // высота старта
    if(P.h>0){g.fillStyle=C.soft;g.fillRect(ox-30,Y(P.h),30,P.h*k);g.strokeStyle=C.ink;g.lineWidth=2;g.strokeRect(ox-30,Y(P.h),30,P.h*k)}
    // предсказанная траектория
    g.setLineDash([6,8]);g.strokeStyle=C.muted;g.lineWidth=2;g.beginPath();
    for(let i=0;i<=80;i++){const t=c.T*i/80,x=P.v*Math.cos(rad(P.a))*t,y=Math.max(0,P.h+P.v*Math.sin(rad(P.a))*t-P.g*t*t/2);i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y))}
    g.stroke();g.setLineDash([]);
    // след
    g.strokeStyle=LABC(this);g.lineWidth=4;g.lineJoin='round';g.beginPath();
    g.moveTo(X(0),Y(P.h));for(const p of S.trail)g.lineTo(X(p[0]),Y(p[1]));g.lineTo(X(S.x),Y(S.y));g.stroke();
    // мяч и скорость
    g.fillStyle=C.plum;g.beginPath();g.arc(X(S.x),Y(S.y),9,0,7);g.fill();
    g.strokeStyle=C.surf;g.lineWidth=3;g.stroke();
    if(!S.done){arrow(g,X(S.x),Y(S.y),X(S.x)+S.vx*2.2,Y(S.y)-S.vy*2.2,C.teal,3);}
    // высота
    txt(g,'t = '+f1(S.t,2)+' с',W-14,30,{a:'right',s:15,w:700});
    txt(g,'y = '+f1(S.y)+' м',W-14,50,{a:'right',s:13,c:C.muted,w:500});
  },
  outs(S,P){const c=this.calc(P);return[['Дальность',f1(c.R)+' м'],['Максимальная высота',f1(c.Hm)+' м'],['Время полёта',f1(c.T,2)+' с'],['Скорость сейчас',f1(Math.hypot(S.vx,S.vy))+' м/с']]}
});

/* 2. Маятник */
LABS.push({
  id:'pendulum',title:'Математический маятник',cat:'Колебания',color:'#3E8E8A',
  short:'Груз на нити качается вперёд и назад. От чего зависит период колебаний?',
  params:[
    {id:'L',label:'Длина нити',min:0.3,max:3,step:0.1,val:1.5,unit:'м',d:1},
    {id:'g',label:'Ускорение свободного падения',min:1,max:25,step:0.1,val:9.8,unit:'м/с²',d:1},
    {id:'a0',label:'Начальное отклонение',min:5,max:80,step:1,val:30,unit:'°'},
    {id:'c',label:'Трение (затухание)',min:0,max:1,step:0.01,val:0.05,unit:'',d:2}
  ],
  presets:[['Земля',{g:9.8}],['Луна',{g:1.6}],['Без трения',{c:0}],['Секундный',{L:1,g:9.8}]],
  restartOn:['a0'],
  def:'Маятник — тело, которое колеблется на нити. Период зависит от длины нити и ускорения свободного падения, но почти не зависит от массы и небольшого размаха.',
  formulas:['T = 2π·√(L / g)','f = 1 / T'],
  tryit:['Увеличьте длину нити в 4 раза — период вырастет ровно вдвое.','Уберите трение и сравните отклонение 10° и 70°.','Отнесите маятник на Луну: как изменится период?'],
  init(S,P){S.th=rad(P.a0);S.w=0;S.t=0;S.hist=[];S.per=null;S.lastC=null},
  step(S,P,dt){
    const n=10,h=dt/n;
    for(let i=0;i<n;i++){const al=-(P.g/P.L)*Math.sin(S.th)-P.c*3*S.w;const wo=S.w;S.w+=al*h;S.th+=S.w*h;S.t+=h;
      if(wo<0&&S.w>=0){if(S.lastC!==null)S.per=S.t-S.lastC;S.lastC=S.t}}
    pushHist(S,S.t,S.th);
  },
  draw(g,S,P){
    const px=250,py=44,k=70,Lp=P.L*k;
    g.strokeStyle=C.grid;g.lineWidth=2;g.setLineDash([5,7]);
    g.beginPath();g.moveTo(px,py);g.lineTo(px,py+Lp+30);g.stroke();
    const A=rad(P.a0);g.beginPath();g.arc(px,py,Lp,Math.PI/2-A,Math.PI/2+A);g.stroke();g.setLineDash([]);
    const bx=px+Lp*Math.sin(S.th),by=py+Lp*Math.cos(S.th);
    g.strokeStyle=C.ink;g.lineWidth=2.5;g.beginPath();g.moveTo(px,py);g.lineTo(bx,by);g.stroke();
    g.fillStyle=C.ink;g.fillRect(px-46,py-12,92,10);
    g.fillStyle=C.teal;g.beginPath();g.arc(bx,by,17,0,7);g.fill();g.strokeStyle=C.surf;g.lineWidth=3;g.stroke();
    g.fillStyle=C.ink;g.beginPath();g.arc(px,py,4,0,7);g.fill();
    graph(g,470,18,152,120,S.hist,rad(P.a0)||1,C.teal,'угол отклонения, 6 с');
    txt(g,'θ = '+f1(deg(S.th))+'°',24,H-18,{s:15,w:700});
  },
  outs(S,P){return[['Период (по формуле)',f1(2*Math.PI*Math.sqrt(P.L/P.g),2)+' с'],['Период (измерен)',S.per?f1(S.per,2)+' с':'ждём…'],['Частота',f1(1/(2*Math.PI*Math.sqrt(P.L/P.g)),2)+' Гц'],['Скорость груза',f1(Math.abs(S.w)*P.L)+' м/с']]}
});

/* 3. Пружинный маятник */
LABS.push({
  id:'spring',title:'Пружинный маятник',cat:'Колебания',color:'#367A55',
  short:'Груз на пружине колеблется по столу. Жёсткость и масса меняют ритм.',
  params:[
    {id:'m',label:'Масса груза',min:0.1,max:5,step:0.1,val:1,unit:'кг',d:1},
    {id:'k',label:'Жёсткость пружины',min:5,max:200,step:1,val:50,unit:'Н/м'},
    {id:'A',label:'Начальное растяжение',min:0.2,max:1.4,step:0.05,val:0.8,unit:'м',d:2},
    {id:'c',label:'Трение',min:0,max:5,step:0.1,val:0.3,unit:'кг/с',d:1}
  ],
  presets:[['Лёгкий и жёсткий',{m:0.3,k:150}],['Тяжёлый и мягкий',{m:4,k:20}],['Без трения',{c:0}]],
  restartOn:['A'],
  def:'При колебаниях груза на пружине сила упругости всё время возвращает его к положению равновесия. Чем тяжелее груз, тем медленнее колебания, а чем жёстче пружина — тем быстрее.',
  formulas:['F = −k·x','T = 2π·√(m / k)'],
  tryit:['Увеличьте массу вчетверо — период вырастет вдвое.','Поставьте трение 0: энергия сохраняется, размах не падает.','Найдите жёсткость, при которой период равен 1 с.'],
  init(S,P){S.x=P.A;S.v=0;S.t=0;S.hist=[]},

  presets:[['Одинаковые R',{R1:20,R2:20}],['Большой ток',{U:24,R1:2,R2:2}],['Слабый ток',{U:3,R1:50,R2:50}]],
  restartOn:[],
  def:'Сила тока в участке цепи прямо пропорциональна напряжению и обратно пропорциональна сопротивлению. При последовательном соединении ток один, а сопротивления складываются. При параллельном одинаково напряжение, а токи складываются.',
  formulas:['I = U / R','последовательно: R = R₁ + R₂','параллельно: 1/R = 1/R₁ + 1/R₂','P = U · I'],
  tryit:['Увеличьте напряжение вдвое: что будет с током?','Сравните общее сопротивление при разных соединениях при R₁ = R₂.','В какой цепи сильнее нагревается меньший резистор?'],
  init(S){S.s=[0,0]},
  calc(P){
    if(P.mode==='s'){const R=P.R1+P.R2,I=P.U/R;return{R,I,I1:I,I2:I,U1:I*P.R1,U2:I*P.R2}}
    const R=P.R1*P.R2/(P.R1+P.R2),I1=P.U/P.R1,I2=P.U/P.R2;return{R,I:I1+I2,I1,I2,U1:P.U,U2:P.U}
  },
  step(S,P,dt){const c=this.calc(P);S.s[0]+=dt*(20+40*Math.sqrt(c.I1));S.s[1]+=dt*(20+40*Math.sqrt(c.I2))},
  draw(g,S,P){
    const c=this.calc(P),ser=P.mode==='s';
    const paths=ser?[[[90,300],[90,100],[570,100],[570,300],[90,300]]]:[[[90,300],[90,100],[300,100],[300,300],[90,300]],[[90,300],[90,100],[480,100],[480,300],[90,300]]];
    // провода
    g.strokeStyle=C.ink;g.lineWidth=4;g.lineJoin='round';g.lineCap='round';
    for(const p of paths){g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke()}
    // батарея
    g.fillStyle=C.surf;g.fillRect(60,176,60,48);
    g.lineWidth=5;g.beginPath();g.moveTo(70,188);g.lineTo(110,188);g.stroke();g.lineWidth=5;g.beginPath();g.moveTo(80,212);g.lineTo(100,212);g.stroke();
    txt(g,'+',124,194,{s:20,w:800,c:C.plum});txt(g,'−',124,222,{s:20,w:800,c:C.muted});
    txt(g,f1(P.U,P.U%1?1:0)+' В',56,204,{s:15,a:'right',w:700});
    // резисторы
    const heat=(I,R)=>Math.min(1,0.15+I*I*R/70);
    const res=(x,y,w,h,label,hv)=>{g.fillStyle=C.surf;g.fillRect(x,y,w,h);g.fillStyle=rgba('#F39C3D',hv);g.beginPath();g.roundRect(x,y,w,h,8);g.fill();g.strokeStyle=C.ink;g.lineWidth=3;g.stroke()};
    if(ser){
      res(210,84,90,32,'',heat(c.I1,P.R1));res(390,84,90,32,'',heat(c.I2,P.R2));
      txt(g,'R₁ = '+P.R1+' Ом',255,72,{a:'center',s:14,w:700});txt(g,'R₂ = '+P.R2+' Ом',435,72,{a:'center',s:14,w:700});
    }else{
      res(285,170,30,66,'',heat(c.I1,P.R1));res(465,170,30,66,'',heat(c.I2,P.R2));
      txt(g,'R₁ = '+P.R1+' Ом',322,208,{s:14,w:700});txt(g,'R₂ = '+P.R2+' Ом',502,208,{s:14,w:700});
    }
    // электроны/заряды
    paths.forEach((p,pi)=>{
      const segs=[];let L=0;for(let i=0;i<p.length-1;i++){const l=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);segs.push([p[i],p[i+1],l,L]);L+=l}
      const sp=26,n=Math.floor(L/sp),off=S.s[ser?0:pi];
      g.fillStyle=C.lime;
      for(let k=0;k<n;k++){let d=(k*sp+off)%L;const sg=segs.find(s=>d>=s[3]&&d<s[3]+s[2])||segs[0];const t=(d-sg[3])/sg[2];
        g.beginPath();g.arc(sg[0][0]+(sg[1][0]-sg[0][0])*t,sg[0][1]+(sg[1][1]-sg[0][1])*t,5.5,0,7);g.fill();g.strokeStyle=C.ink;g.lineWidth=1.5;g.stroke()}
    });
    txt(g,'I = '+f1(c.I,2)+' А',W-16,H-16,{a:'right',s:18,w:800});
  },
  outs(S,P){const c=this.calc(P),ser=P.mode==='s';return[['Общее сопротивление',f1(c.R,2)+' Ом'],['Общая сила тока',f1(c.I,2)+' А'],[ser?'Напряжения U₁ / U₂':'Токи I₁ / I₂',ser?f1(c.U1)+' / '+f1(c.U2)+' В':f1(c.I1,2)+' / '+f1(c.I2,2)+' А'],['Мощность',f1(P.U*c.I)+' Вт']]}
});

function LABC(lab){return lab.color}

/* ===================== APP ===================== */
const app=$('#app');
let visited=new Set();
try{visited=new Set(JSON.parse(localStorage.getItem('lab-sirius-visited')||'[]'))}catch(e){}
function saveVisited(){try{localStorage.setItem('lab-sirius-visited',JSON.stringify([...visited]))}catch(e){}}

const CATS=['Все',...Array.from(new Set(LABS.map(l=>l.cat)))];
let filter='Все',cur=null,P={},S={},paused=false,raf=0,last=0,outT=0,cv=null,g=null;

const logoSVG='<svg viewBox="0 0 50 36" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="color:var(--brand)"><path d="M3 4h16c3 0 6 2 6 5v23c0-3-3-5-6-5H3z"/><path d="M47 4H31c-3 0-6 2-6 5v23c0-3 3-5 6-5h16z"/></svg>';
function header(){return `<header class="top"><button class="logo" data-act="home" aria-label="На главную">${logoSVG}<div><b>Лаборатория</b><span> Сириус</span></div></button></header>`}

function home(){
  stop();cur=null;
  const done=LABS.filter(l=>visited.has(l.id)).length;
  app.innerHTML=header()+`
  <section class="hero"><h1>Физические явления</h1><p>Запускайте опыты, меняйте параметры и смотрите, как работает физика.</p></section>
  <div class="progress"><span>Изучено ${done} из ${LABS.length}</span><div class="bar"><i style="width:${done/LABS.length*100}%"></i></div></div>
  <div class="chips" role="group" aria-label="Разделы">${CATS.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${c===filter}">${c}</button>`).join('')}</div>
  <div class="cards">${LABS.filter(l=>filter==='Все'||l.cat===filter).map(l=>`
    <button class="card ${visited.has(l.id)?'seen':''}" style="--c:${l.color}" data-lab="${l.id}">
      <div class="pb"><i></i></div>
      <span class="tag">${l.cat}</span>
      <h2>${l.title}</h2><p>${l.short}</p>
      <div class="foot"><span class="meta">Параметров: ${l.params.length}</span><span class="go">Открыть</span></div>
    </button>`).join('')}</div>`;
  window.scrollTo(0,0);
}

function fmtVal(p,v){const d=p.d!==undefined?p.d:(p.step<1?1:0);return f1(v,d)+(p.unit?' '+p.unit:'')}

function openLab(id){
  stop();cur=LABS.find(l=>l.id===id);visited.add(id);saveVisited();paused=false;
  P={};cur.params.forEach(p=>P[p.id]=p.val);S={};cur.init(S,P);
  const l=cur;
  app.innerHTML=header()+`
  <section class="labhead" style="--lab:${l.color}">
    <button class="back" data-act="home"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>Все явления</button>
    <h1>${l.title}</h1><p>${l.short}</p><span class="tag">${l.cat}</span>
  </section>
  <main class="sheet" style="--lab:${l.color}">
    <div class="stage"><canvas id="cv" aria-label="Интерактивная модель: ${l.title}"></canvas></div>
    <div class="tools">
      ${l.launch?'<button class="btn main" data-act="restart">Запустить снова</button>':''}
      <button class="btn ${l.launch?'':'main'}" data-act="pause">Пауза</button>
      <button class="btn" data-act="reset">Сбросить параметры</button>
    </div>
    <div class="outs" id="outs"></div>
    <h2>Настрой опыт</h2>
    ${l.presets?`<div class="presets">${l.presets.map((p,i)=>`<button class="chip" data-preset="${i}">${p[0]}</button>`).join('')}</div>`:''}
    <div id="ctls">${l.params.map(controlHTML).join('')}</div>
    <div class="note"><b>Явление.</b> ${l.def}</div>
    <div class="note f"><b>Формулы</b>${l.formulas.map(f=>`<div class="fm">${f}</div>`).join('')}</div>
    <div class="note f"><b>Попробуйте сами</b><ol>${l.tryit.map(t=>`<li>${t}</li>`).join('')}</ol></div>
  </main>`;
  cv=$('#cv');g=cv.getContext('2d');sizeCanvas();readColors();
  window.scrollTo(0,0);updateOuts();
  last=performance.now();raf=requestAnimationFrame(loop);
}
function controlHTML(p){
  if(p.type==='seg')return `<div class="ctl"><div class="r"><span>${p.label}</span></div><div class="seg" data-seg="${p.id}">${p.options.map(o=>`<button data-v="${o[0]}" aria-pressed="${o[0]===P[p.id]}">${o[1]}</button>`).join('')}</div></div>`;
  return `<div class="ctl"><label class="r" for="p_${p.id}"><span>${p.label}</span><span class="val" id="v_${p.id}">${fmtVal(p,p.val)}</span></label><input type="range" id="p_${p.id}" data-p="${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.val}"></div>`;
}
function syncControls(){
  cur.params.forEach(p=>{
    if(p.type==='seg'){document.querySelectorAll(`[data-seg="${p.id}"] button`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===P[p.id]))}
    else{const el=$('#p_'+p.id);if(el){el.value=P[p.id];$('#v_'+p.id).textContent=fmtVal(p,P[p.id])}}
  });
}
function changed(id){
  const r=cur.restartOn;
  if(r==='all'||(Array.isArray(r)&&r.includes(id)))cur.init(S,P);
}
function sizeCanvas(){
  if(!cv)return;const dpr=Math.min(window.devicePixelRatio||1,2.5),w=cv.clientWidth||W;
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*H/W);g.setTransform(cv.width/W,0,0,cv.width/W,0,0);
}
function updateOuts(){
  if(!cur)return;const o=$('#outs');if(!o)return;
  o.innerHTML=cur.outs(S,P).map(x=>`<div class="out"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');
}
function loop(ts){
  if(!cur)return;
  const dt=Math.min(.033,(ts-last)/1000);last=ts;
  if(!paused)cur.step(S,P,dt);
  readColors();
  g.clearRect(0,0,W,H);g.fillStyle=C.surf;g.fillRect(0,0,W,H);
  cur.draw(g,S,P);
  outT+=dt;if(outT>.2){outT=0;updateOuts()}
  raf=requestAnimationFrame(loop);
}
function stop(){cancelAnimationFrame(raf);raf=0}

app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.act==='home'){home();return}
  if(t.dataset.cat){filter=t.dataset.cat;home();return}
  if(t.dataset.lab){openLab(t.dataset.lab);return}
  if(!cur)return;
  if(t.dataset.act==='pause'){paused=!paused;t.textContent=paused?'Продолжить':'Пауза';return}
  if(t.dataset.act==='restart'){cur.init(S,P);paused=false;const pb=$('[data-act="pause"]');if(pb)pb.textContent='Пауза';return}
  if(t.dataset.act==='reset'){cur.params.forEach(p=>P[p.id]=p.val);cur.init(S,P);syncControls();updateOuts();return}
  if(t.dataset.preset!==undefined){Object.assign(P,cur.presets[+t.dataset.preset][1]);cur.init(S,P);syncControls();updateOuts();return}
  const seg=t.closest('[data-seg]');
  if(seg){P[seg.dataset.seg]=t.dataset.v;syncControls();changed(seg.dataset.seg);updateOuts()}
});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset.p||!cur)return;
  const p=cur.params.find(x=>x.id===el.dataset.p);P[p.id]=parseFloat(el.value);
  $('#v_'+p.id).textContent=fmtVal(p,P[p.id]);changed(p.id);
});
window.addEventListener('resize',sizeCanvas);
if(window.ResizeObserver)new ResizeObserver(sizeCanvas).observe(document.body);
document.addEventListener('visibilitychange',()=>{last=performance.now()});

home();
})();
</script>
</body>
</html>
